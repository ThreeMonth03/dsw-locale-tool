services:
  locale-installer:
    image: ghcr.io/threemonth03/dsw-locale-installer:4.32.2
    platform: linux/amd64
    restart: "no"
    depends_on:
      server:
        condition: service_started
    environment:
      DSW_API_URL: http://server:3000/wizard-api
      DSW_API_KEY_FILE: /run/secrets/dsw_locale_api_key
    secrets:
      - dsw_locale_api_key
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  dsw_locale_api_key:
    file: ./secrets/dsw_locale_api_key
