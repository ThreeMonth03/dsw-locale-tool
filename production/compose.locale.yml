services:
  locale-installer:
    image: "${DSW_LOCALE_INSTALLER_IMAGE:?Set DSW_LOCALE_INSTALLER_IMAGE to an immutable locale installer image}"
    platform: linux/amd64
    restart: "no"
    depends_on:
      server:
        condition: service_started
    network_mode: service:server
    environment:
      DSW_API_URL: http://localhost:3000/wizard-api
      DSW_API_KEY_FILE: /run/secrets/dsw_locale_api_key
    secrets:
      - dsw_locale_api_key
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  dsw_locale_api_key:
    file: ./secrets/dsw_locale_api_key
