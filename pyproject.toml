[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "dsw-locale-tool"
version = "0.1.0"
description = "Synchronize, audit, and package local DSW UI locale overlays"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "depositar" }]
dependencies = [
  "polib>=1.2,<2",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "furo>=2024.8.6",
  "myst-parser>=4,<5",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.12.12,<1",
  "Sphinx>=8,<9",
]
preview = [
  "playwright>=1.50,<2",
]

[project.scripts]
dsw-locale = "dsw_locale_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
