schema_version: 1
pages:
  - name: login
    title: Sign in
    group: Account
    route: /login
    authenticated: false
    requires_project: false
  - name: dashboard
    title: Dashboard
    group: General
    route: /
    authenticated: true
    requires_project: false
  - name: projects
    title: Projects
    group: General
    route: /projects
    authenticated: true
    requires_project: false
  - name: locales
    title: Locales
    group: Administration
    route: /locales
    authenticated: true
    requires_project: false
  - name: project-documents
    title: Project documents
    group: General
    route: /project-documents
    authenticated: true
    requires_project: false
  - name: settings-organization
    title: Organization settings
    group: Administration
    route: /settings/organization
    authenticated: true
    requires_project: false
  - name: settings-authentication
    title: Authentication settings
    group: Administration
    route: /settings/authentication
    authenticated: true
    requires_project: false
  - name: settings-open-id
    title: OpenID providers
    group: Administration
    route: /settings/open-id
    authenticated: true
    requires_project: false
  - name: settings-open-id-create
    title: Create an OpenID provider
    group: Administration
    route: /settings/open-id/create
    authenticated: true
    requires_project: false
  - name: questionnaire
    title: Questionnaire
    group: Project
    route: /projects/{project_uuid}
    authenticated: true
    requires_project: true
  - name: project-settings
    title: Project settings
    group: Project
    route: /projects/{project_uuid}/settings
    authenticated: true
    requires_project: true
  - name: questionnaire-documents
    title: Questionnaire documents
    group: Project
    route: /projects/{project_uuid}/documents
    authenticated: true
    requires_project: true
scenarios:
  - name: openid-microsoft-advanced-form
    title: Microsoft OpenID advanced settings
    route: /settings/open-id/create
    trigger: .row.mt-4.mb-1 a.fw-bold
    ready: .border-start.border-5
    trigger_match: only
    requires_project: false
  - name: openid-custom-form
    title: Custom OpenID provider
    route: /settings/open-id/create
    trigger: .nav-tabs .nav-link
    ready: "#url"
    trigger_match: last
    requires_project: false
  - name: project-share-dialog
    title: Project sharing dialog
    route: /projects/{project_uuid}
    trigger: '[data-cy="project_detail_share-button"]'
    ready: '.modal.visible [data-cy="modal_project-share"]'
    trigger_match: only
    requires_project: true
  - name: question-comment-panel
    title: Question comment panel
    route: /projects/{project_uuid}
    trigger: '[data-cy="questionnaire_question-action_comment"]'
    ready: '[data-cy="comments_reply-form_input_new_public"]'
    trigger_match: first
    requires_project: true
  - name: project-delete-dialog
    title: Project deletion dialog
    route: /projects/{project_uuid}/settings
    trigger: .card.border-danger button.btn-outline-danger
    ready: '.modal.visible [data-cy="modal_project-delete"]'
    trigger_match: only
    requires_project: true
