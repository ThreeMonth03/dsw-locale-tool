services:
  bucket-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "mkdir -p /data/engine-wizard"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - minio-data:/data
    networks:
      - internal

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    restart: unless-stopped
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioPassword
    security_opt:
      - no-new-privileges:true
    volumes:
      - minio-data:/data
    networks:
      - internal

  postgres:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: engine-wizard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engine-wizard"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  server:
    image: datastewardshipwizard/wizard-server:${DSW_VERSION:?Set DSW_VERSION}
    platform: ${DSW_SERVER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DSW_REVIEW_RUNTIME_DIR:-./runtime/default}/application.yml:/app/config/application.yml:ro
    networks:
      - internal

  client:
    image: ${DSW_CLIENT_IMAGE:?Set DSW_CLIENT_IMAGE}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      API_URL: ${DSW_REVIEW_ORIGIN:?Set DSW_REVIEW_ORIGIN}/wizard-api
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./client/head-extra.html:/src/head-extra.html:ro
    networks:
      - internal

  gateway:
    image: nginx:1.28-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_started
    ports:
      - 127.0.0.1:${DSW_REVIEW_PORT:-8088}:8080
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DSW_REVIEW_RUNTIME_DIR:-./runtime/default}:/opt/dsw-review/runtime:ro
    networks:
      - edge
      - internal

  review-tool:
    image: ${DSW_REVIEW_TOOL_IMAGE:?Set DSW_REVIEW_TOOL_IMAGE}
    profiles:
      - setup
    user: ${DSW_REVIEW_UID:-1000}:${DSW_REVIEW_GID:-1000}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      DSW_API_URL: http://server:3000/wizard-api
      DSW_CLIENT_URL: ${DSW_REVIEW_ORIGIN:?Set DSW_REVIEW_ORIGIN}/wizard
      DSW_ADMIN_EMAIL: ${DSW_ADMIN_EMAIL:-albert.einstein@example.com}
      DSW_ADMIN_PASSWORD: ${DSW_ADMIN_PASSWORD:?Set DSW_ADMIN_PASSWORD}
      DSW_REVIEW_ORIGIN: ${DSW_REVIEW_ORIGIN}
    volumes:
      - ./pages.yml:/inputs/pages.yml:ro
      - ${DSW_REVIEW_LOCALE_BUNDLE:?Set DSW_REVIEW_LOCALE_BUNDLE}:/inputs/locale.zip:ro
      - ${DSW_REVIEW_KNOWLEDGE_MODEL:?Set DSW_REVIEW_KNOWLEDGE_MODEL}:/inputs/knowledge-model.json:ro
      - ${DSW_REVIEW_DOCUMENT_TEMPLATE:?Set DSW_REVIEW_DOCUMENT_TEMPLATE}:/inputs/document-template.zip:ro
      - ${DSW_REVIEW_RUNTIME_DIR:-./runtime/default}:/output
    networks:
      - internal

volumes:
  minio-data:
  postgres-data:

networks:
  edge:
  internal:
    internal: true
