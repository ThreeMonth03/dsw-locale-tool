worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  map_hash_bucket_size 256;

  map $uri $review_route_allowed {
    default 0;
    include /opt/dsw-review/runtime/site/allowed-routes.map;
  }

  map $http_upgrade $review_is_upgrade {
    default 1;
    "" 0;
  }

  limit_req_zone $binary_remote_addr zone=review_api:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=review_connections:10m;

  server {
    listen 8080;
    root /opt/dsw-review/runtime/site;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    limit_conn review_connections 20;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = / {
      try_files /index.html =404;
    }

    location ^~ /review/ {
      try_files $uri =404;
    }

    location = /wizard {
      return 302 /wizard/;
    }

    location = /wizard-api/tokens {
      if ($review_is_upgrade) { return 403; }
      limit_except POST OPTIONS { deny all; }
      limit_req zone=review_api burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://server:3000;
    }

    location ~ ^/wizard-api/projects/[^/]+/websocket$ {
      return 403;
    }

    location /wizard-api/ {
      if ($review_is_upgrade) { return 403; }
      limit_except GET HEAD OPTIONS { deny all; }
      limit_req zone=review_api burst=60 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade "";
      proxy_set_header Connection "";
      proxy_pass http://server:3000;
    }

    location ~ ^/wizard/(?:assets/.*|[^/]+\.(?:css|js|png|svg|ttf|woff2|txt))$ {
      proxy_set_header Host $host;
      proxy_pass http://client:8080;
    }

    location /wizard/ {
      if ($review_route_allowed = 0) { return 404; }
      proxy_set_header Host $host;
      proxy_pass http://client:8080;
    }

    location / {
      return 404;
    }
  }
}
