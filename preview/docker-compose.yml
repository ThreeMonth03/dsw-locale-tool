services:
  bucket-init:
    image: busybox:1.37.0
    command: ["sh", "-c", "mkdir -p /data/engine-wizard"]
    restart: "no"
    volumes:
      - minio-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    restart: unless-stopped
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioPassword
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: engine-wizard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engine-wizard"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    image: datastewardshipwizard/wizard-server:${DSW_VERSION:?Set DSW_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - 127.0.0.1:${DSW_SERVER_PORT:-3000}:3000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./runtime/application.yml:/app/config/application.yml:ro

  client:
    image: ${DSW_CLIENT_IMAGE:?Set DSW_CLIENT_IMAGE}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${DSW_CLIENT_PORT:-8080}:8080
    depends_on:
      server:
        condition: service_started
    environment:
      API_URL: http://localhost:${DSW_SERVER_PORT:-3000}/wizard-api

volumes:
  minio-data:
  postgres-data:
