name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development dependencies
        run: make install-dev

      - name: Run checks
        run: make check

      - name: Validate review deployment
        run: |
          env \
            DSW_VERSION=test \
            DSW_CLIENT_IMAGE=wizard-client:test \
            DSW_REVIEW_ORIGIN=http://127.0.0.1:8088 \
            DSW_REVIEW_PORT=8088 \
            DSW_REVIEW_TOOL_IMAGE=dsw-review-tool:test \
            DSW_REVIEW_LOCALE_BUNDLE="$PWD/README.md" \
            DSW_REVIEW_KNOWLEDGE_MODEL="$PWD/README.md" \
            DSW_ADMIN_PASSWORD=password \
            docker compose --file review/docker-compose.yml config --quiet

          .venv/bin/python -c \
            "from dsw_locale_tool.review import generate_review_site, load_review_manifest; generate_review_site(load_review_manifest('review/pages.yml'), 'build/review-nginx/site', project_uuid='fb984853-ab21-4250-85de-28ee9a36069b', reviewer_email='reviewer@example.test', reviewer_password='disposable')"

          docker run --rm \
            --add-host server:127.0.0.1 \
            --add-host client:127.0.0.1 \
            --volume "$PWD/review/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$PWD/build/review-nginx:/opt/dsw-review/runtime:ro" \
            nginx:1.28-alpine nginx -t
