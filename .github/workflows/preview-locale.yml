name: Preview one DSW locale release

on:
  workflow_call:
    inputs:
      translation_repository:
        required: true
        type: string
      translation_control_repository:
        required: true
        type: string
      translation_control_ref:
        required: true
        type: string
      translation_ref:
        required: true
        type: string
      config_version:
        required: true
        type: string
      dsw_image_tag:
        required: true
        type: string
      file_knowledge_model_url:
        required: false
        type: string
        default: https://raw.githubusercontent.com/ds-wizard/dsw-e2e-tests/abdcfaef0851f6230e1b4c2eaeb96848c0a4c5a6/cypress/fixtures/file-km.json

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DSW_VERSION: ${{ inputs.dsw_image_tag }}
      DSW_CLIENT_IMAGE: datastewardshipwizard/wizard-client:${{ inputs.dsw_image_tag }}
      DSW_API_URL: http://localhost:3000/wizard-api
      DSW_CLIENT_URL: http://localhost:8080/wizard
      DSW_ADMIN_EMAIL: albert.einstein@example.com
      DSW_ADMIN_PASSWORD: password
    steps:
      - name: Check out tool
        uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: main
          path: tool
          persist-credentials: false

      - name: Check out translation content
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: ${{ inputs.translation_ref }}
          path: locale
          persist-credentials: false

      - name: Check out translation control configuration
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_control_repository }}
          ref: ${{ inputs.translation_control_ref }}
          path: control
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install tool and Chromium
        run: |
          python -m pip install './tool[preview]'
          python -m playwright install --with-deps chromium

      - name: Build locale package
        run: |
          dsw-locale validate-config locale/translation-config.yml
          dsw-locale refresh-tree --root locale
          dsw-locale audit \
            --root locale \
            --report-dir reports \
            --fail-on placeholders \
            --fail-on structure
          dsw-locale build-source \
            --config locale/translation-config.yml \
            --version "${{ inputs.config_version }}" \
            --root locale \
            --output build/locale
          dsw-locale package \
            --source build/locale \
            --output dist/locale.zip

      - name: Start disposable DSW
        run: |
          dsw-locale preview-config \
            --output tool/preview/runtime/application.yml \
            --client-url "$DSW_CLIENT_URL"
          docker compose \
            --project-name dsw-locale-preview \
            --file tool/preview/docker-compose.yml \
            up --detach

      - name: Install locale as default
        run: |
          dsw-locale install-dsw \
            --bundle dist/locale.zip \
            --default-locale

      - name: Download verified translated preview content
        id: preview-content
        run: |
          result=$(dsw-locale fetch-preview-content \
            --config control/translation-config.yml \
            --version "${{ inputs.config_version }}" \
            --output build/preview-content)
          echo "$result"
          echo "document_format_uuid=$(jq --raw-output .document_format_uuid <<< "$result")" \
            >> "$GITHUB_OUTPUT"

      - name: Download file preview Knowledge Model
        if: inputs.file_knowledge_model_url != ''
        run: curl --fail --location "${{ inputs.file_knowledge_model_url }}" --output build/file-preview.km

      - name: Create questionnaire
        id: questionnaire
        run: |
          project_uuid=$(dsw-locale seed-project \
            --knowledge-model build/preview-content/knowledge-model.km \
            --document-template build/preview-content/document-template.zip \
            --document-format-uuid "${{ steps.preview-content.outputs.document_format_uuid }}" \
            --project-name "Locale Preview")
          echo "project_uuid=$project_uuid" >> "$GITHUB_OUTPUT"

      - name: Create file questionnaire
        id: file-questionnaire
        if: inputs.file_knowledge_model_url != ''
        run: |
          project_uuid=$(dsw-locale seed-project \
            --knowledge-model build/file-preview.km \
            --project-name "File Locale Preview")
          echo "project_uuid=$project_uuid" >> "$GITHUB_OUTPUT"

      - name: Capture translated pages
        env:
          PROJECT_UUID: ${{ steps.questionnaire.outputs.project_uuid }}
          FILE_PROJECT_UUID: ${{ steps.file-questionnaire.outputs.project_uuid }}
        run: |
          arguments=(
            capture-preview
            --output preview-artifact
            --locale-root locale
            --review-manifest tool/review/pages.yml
            --allow-text "Locale Preview"
            --allow-text "File Locale Preview"
          )
          if [ -n "$PROJECT_UUID" ]; then
            arguments+=(--project-uuid "$PROJECT_UUID")
          fi
          arguments+=(--allowed-content-json build/preview-content/knowledge-model.km)
          if [ -n "$FILE_PROJECT_UUID" ]; then
            arguments+=(
              --file-project-uuid "$FILE_PROJECT_UUID"
              --preview-file tool/preview/fixtures/preview.csv
            )
          fi
          if [ -f build/file-preview.km ]; then
            arguments+=(--allowed-content-json build/file-preview.km)
          fi
          dsw-locale "${arguments[@]}"

      - name: Add runtime findings to job summary
        if: always() && hashFiles('preview-artifact/runtime.md') != ''
        run: cat preview-artifact/runtime.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p preview-artifact
          docker compose \
            --project-name dsw-locale-preview \
            --file tool/preview/docker-compose.yml \
            logs --no-color > preview-artifact/docker-compose.log

      - name: Upload preview, audit, and locale package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsw-locale-preview-${{ inputs.config_version }}
          if-no-files-found: warn
          path: |
            preview-artifact/
            reports/
            dist/locale.zip

      - name: Stop disposable DSW
        if: always()
        run: |
          docker compose \
            --project-name dsw-locale-preview \
            --file tool/preview/docker-compose.yml \
            down --volumes --remove-orphans
