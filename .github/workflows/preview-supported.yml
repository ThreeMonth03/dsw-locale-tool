name: Preview maintained DSW releases

on:
  workflow_dispatch:
    inputs:
      translation_repository:
        description: Translation content repository
        required: true
        default: ThreeMonth03/dsw-ui-locales-zh_Hant
        type: string
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

concurrency:
  group: maintained-locale-previews
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      translation_repository: ${{ steps.repository.outputs.value }}
    env:
      TRANSLATION_REPOSITORY: ${{ inputs.translation_repository || 'ThreeMonth03/dsw-ui-locales-zh_Hant' }}
    steps:
      - name: Check out tool
        uses: actions/checkout@v6
        with:
          path: tool

      - name: Check out translation control branch
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TRANSLATION_REPOSITORY }}
          ref: main
          path: locale

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Install tool
        run: python -m pip install ./tool

      - name: Resolve translation repository
        id: repository
        run: echo "value=$TRANSLATION_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Resolve maintained release matrix
        id: matrix
        run: echo "value=$(dsw-locale preview-matrix --config locale/translation-config.yml)" >> "$GITHUB_OUTPUT"

  preview:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/preview-locale.yml
    with:
      translation_repository: ${{ needs.plan.outputs.translation_repository }}
      translation_ref: ${{ matrix.translation_ref }}
      config_version: ${{ matrix.config_version }}
      dsw_image_tag: ${{ matrix.dsw_image_tag }}
