name: Host an ephemeral DSW locale review

on:
  workflow_call:
    inputs:
      translation_repository:
        required: true
        type: string
      pull_request_repository:
        required: true
        type: string
      translation_ref:
        required: true
        type: string
      translation_label:
        required: true
        type: string
      config_version:
        required: true
        type: string
      dsw_image_tag:
        required: true
        type: string
      pull_request_number:
        required: true
        type: number
      pull_request_url:
        required: true
        type: string
      knowledge_model_url:
        required: false
        type: string
        default: https://raw.githubusercontent.com/ds-wizard/dsw-e2e-tests/abdcfaef0851f6230e1b4c2eaeb96848c0a4c5a6/cypress/fixtures/basic-questionnaire-test-km.json
      idle_timeout_minutes:
        required: false
        type: number
        default: 30
      hard_timeout_minutes:
        required: false
        type: number
        default: 180

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CONFIG_VERSION: ${{ inputs.config_version }}
      DSW_VERSION: ${{ inputs.dsw_image_tag }}
      DSW_CLIENT_IMAGE: datastewardshipwizard/wizard-client:${{ inputs.dsw_image_tag }}
      DSW_REVIEW_TOOL_IMAGE: ghcr.io/threemonth03/dsw-review-tool:main
      DSW_REVIEW_ORIGIN: pending
      DSW_REVIEW_PORT: "18088"
      DSW_REVIEW_PROJECT_NAME: dsw-live-review-${{ github.run_id }}-${{ github.run_attempt }}
      DSW_REVIEW_RUNTIME_DIR: ${{ github.workspace }}/tool/review/runtime/live
      DSW_REVIEW_LOCALE_BUNDLE: ${{ github.workspace }}/dist/locale.zip
      DSW_REVIEW_KNOWLEDGE_MODEL: ${{ github.workspace }}/build/preview.km
      DSW_REVIEW_TRANSLATION_REF: ${{ inputs.translation_label }}
      DSW_REVIEW_REVISION: ${{ inputs.translation_ref }}
      DSW_REVIEW_PULL_REQUEST_URL: ${{ inputs.pull_request_url }}
      DSW_REVIEW_IDLE_TIMEOUT_MINUTES: ${{ inputs.idle_timeout_minutes }}
      DSW_REVIEW_HARD_TIMEOUT_MINUTES: ${{ inputs.hard_timeout_minutes }}
      DSW_REVIEW_TUNNEL_CONTAINER: dsw-live-tunnel-${{ github.run_id }}-${{ github.run_attempt }}
      DSW_REVIEW_REPOSITORY: ${{ inputs.pull_request_repository }}
      DSW_REVIEW_PR_NUMBER: ${{ inputs.pull_request_number }}
      DSW_REVIEW_RUN_ID: ${{ github.run_id }}
      DSW_REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DSW_ADMIN_EMAIL: albert.einstein@example.com
      DSW_ADMIN_PASSWORD: password
    steps:
      - name: Check out trusted locale tool
        uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: main
          path: tool
          persist-credentials: false

      - name: Check out translation revision
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: ${{ inputs.translation_ref }}
          path: locale
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install trusted locale tool and browser
        run: |
          python -m pip install './tool[preview]'
          python -m playwright install --with-deps chromium

      - name: Announce preview startup
        env:
          GH_TOKEN: ${{ github.token }}
        run: tool/review/update-pr-comment.sh starting

      - name: Build locale package
        run: |
          mkdir -p build dist
          dsw-locale validate-config locale/translation-config.yml
          dsw-locale refresh-tree --root locale
          dsw-locale audit \
            --root locale \
            --report-dir reports \
            --fail-on placeholders \
            --fail-on structure
          dsw-locale build-source \
            --config locale/translation-config.yml \
            --version "$CONFIG_VERSION" \
            --root locale \
            --output build/locale
          dsw-locale package \
            --source build/locale \
            --output "$DSW_REVIEW_LOCALE_BUNDLE"

      - name: Download sample Knowledge Model
        env:
          KNOWLEDGE_MODEL_URL: ${{ inputs.knowledge_model_url }}
        run: curl --fail --location "$KNOWLEDGE_MODEL_URL" --output "$DSW_REVIEW_KNOWLEDGE_MODEL"

      - name: Start unique public tunnel
        id: tunnel
        run: |
          url=$(tool/review/start-tunnel.sh \
            cloudflare/cloudflared:2026.7.0 \
            "$DSW_REVIEW_TUNNEL_CONTAINER" \
            "$DSW_REVIEW_PORT")
          echo "DSW_REVIEW_ORIGIN=$url" >> "$GITHUB_ENV"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Start isolated read-only DSW
        run: tool/review/up.sh

      - name: Verify the public gateway
        run: |
          dsw-locale verify-review --origin "$DSW_REVIEW_ORIGIN"
          dsw-locale verify-review-browser --origin "$DSW_REVIEW_ORIGIN"

      - name: Publish preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          DSW_REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: tool/review/update-pr-comment.sh ready

      - name: Keep preview available while active
        id: lifecycle
        run: |
          result=$(dsw-locale wait-review \
            --compose-file tool/review/docker-compose.yml \
            --project-name "$DSW_REVIEW_PROJECT_NAME" \
            --tunnel-container "$DSW_REVIEW_TUNNEL_CONTAINER" \
            --idle-timeout-minutes "$DSW_REVIEW_IDLE_TIMEOUT_MINUTES" \
            --hard-timeout-minutes "$DSW_REVIEW_HARD_TIMEOUT_MINUTES")
          echo "$result"
          echo "reason=$(jq --raw-output .reason <<< "$result")" >> "$GITHUB_OUTPUT"

      - name: Remove disposable preview
        if: always()
        run: |
          tool/review/down.sh
          docker rm --force "$DSW_REVIEW_TUNNEL_CONTAINER" >/dev/null 2>&1 || true

      - name: Mark preview as ended
        if: always() && steps.lifecycle.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DSW_REVIEW_END_REASON: ${{ steps.lifecycle.outputs.reason }}
        run: tool/review/update-pr-comment.sh ended

      - name: Mark canceled preview as ended
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          DSW_REVIEW_END_REASON: workflow canceled
        run: tool/review/update-pr-comment.sh ended

      - name: Report preview failure
        if: failure() && steps.lifecycle.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tool/review/update-pr-comment.sh failed
