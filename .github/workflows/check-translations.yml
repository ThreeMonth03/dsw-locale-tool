name: Check translation contributions
on:
  workflow_call:
    inputs:
      tool_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_repository:
        required: true
        type: string
      branch:
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: ${{ inputs.tool_ref }}
          path: tool
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base_sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.head_repository }}
          ref: ${{ inputs.head_sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ./tool
      - name: Validate data without executing contributor code
        env:
          BRANCH: ${{ inputs.branch }}
        run: dsw-locale validate-pr --base-root base --head-root head --branch "$BRANCH" --report-dir reports
      - if: always()
        run: |
          if [ -f reports/audit.md ]; then
            cat reports/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: translation-checks
          path: reports/
