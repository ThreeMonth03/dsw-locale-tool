name: Propagate exact translations

on:
  workflow_call:
    inputs:
      translation_repository:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_pull_request:
        required: true
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Check out trusted locale tool
        uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: main
          path: tool
          persist-credentials: false

      - name: Check out translation control branch
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: main
          path: locale
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install trusted locale tool
        run: python -m pip install ./tool

      - name: Resolve maintained release matrix
        id: matrix
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          matrix=$(dsw-locale maintained-matrix \
            --config locale/translation-config.yml)
          echo "value=$(jq --compact-output \
            --arg source "$SOURCE_REF" \
            '{include: [.include[] | select(.translation_ref != $source)]}' \
            <<< "$matrix")" >> "$GITHUB_OUTPUT"

  propagate:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted locale tool
        uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: main
          path: tool
          persist-credentials: false

      - name: Check out source translation tree
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Check out target translation tree
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: ${{ matrix.translation_ref }}
          path: target
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install trusted locale tool
        run: python -m pip install ./tool

      - name: Propagate exact translations
        id: propagation
        env:
          REPORT_DIRECTORY: reports/${{ matrix.config_version }}
        run: |
          dsw-locale propagate \
            --source-root source \
            --target-root target \
            --report-dir "$REPORT_DIRECTORY"
          echo "applied=$(jq --raw-output '.counts.applied' \
            "$REPORT_DIRECTORY/propagation.json")" >> "$GITHUB_OUTPUT"

      - name: Audit propagated target
        if: steps.propagation.outputs.applied != '0'
        run: |
          dsw-locale audit \
            --root target \
            --report-dir reports/${{ matrix.config_version }}/audit \
            --fail-on placeholders \
            --fail-on structure

      - name: Build propagated target
        if: steps.propagation.outputs.applied != '0'
        run: |
          dsw-locale build-source \
            --config target/translation-config.yml \
            --version "${{ matrix.config_version }}" \
            --root target \
            --output build/${{ matrix.config_version }}/locale
          dsw-locale package \
            --source build/${{ matrix.config_version }}/locale \
            --output dist/${{ matrix.config_version }}/locale.zip

      - name: Commit propagated translations
        if: steps.propagation.outputs.applied != '0'
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_PULL_REQUEST: ${{ inputs.source_pull_request }}
          TARGET_REF: ${{ matrix.translation_ref }}
          APPLIED: ${{ steps.propagation.outputs.applied }}
        run: |
          source_version=${SOURCE_REF#sync/}
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add translations
          git -C target commit \
            -m "Propagate exact translations from ${source_version}" \
            -m "Applied: $APPLIED" \
            -m "Source: $SOURCE_PULL_REQUEST at $SOURCE_SHA"
          git -C target push origin "HEAD:$TARGET_REF"

      - name: Upload propagation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: propagation-${{ matrix.config_version }}
          if-no-files-found: warn
          path: |
            reports/${{ matrix.config_version }}/
            dist/${{ matrix.config_version }}/locale.zip
