name: Synchronize official translations
on:
  workflow_call:
    inputs:
      tool_ref:
        required: true
        type: string
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: locale
      - uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: ${{ inputs.tool_ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ./tool
      - id: plan
        run: |
          dsw-locale reconcile-versions --config locale/translation-config.yml --report-dir reports
          echo "versions=$(jq -c '.managed_versions' reports/maintenance.json)" >> "$GITHUB_OUTPUT"
          cat reports/maintenance.md >> "$GITHUB_STEP_SUMMARY"
      - working-directory: locale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation-config.yml
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize official DSW versions"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: version-discovery
          path: reports/
  sync:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          path: locale
      - uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: ${{ inputs.tool_ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ./tool
      - name: Select version and shared contributor files
        working-directory: locale
        env:
          VERSION: ${{ matrix.version }}
        run: |
          branch="sync/$VERSION"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --create "$branch" origin/main
          fi
          git restore --source=origin/main -- .github docs README.md CONTRIBUTING.md translation-config.yml
      - name: Synchronize catalogs and translation forms
        env:
          VERSION: ${{ matrix.version }}
        run: |
          dsw-locale sync-upstream --config locale/translation-config.yml --version "$VERSION" --root locale
          dsw-locale refresh-tree --root locale
          dsw-locale check --root locale --report-dir reports
      - name: Commit verified synchronization
        working-directory: locale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github docs README.md CONTRIBUTING.md translation-config.yml upstream translations
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize official translations and contributor workflow"
          fi
          git push origin HEAD
      - name: Publish check summary
        if: always()
        run: |
          if [ -f reports/audit.md ]; then
            cat reports/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sync-${{ matrix.version }}
          path: reports/
