name: Publish localizable DSW clients

on:
  workflow_dispatch:
    inputs:
      translation_repository:
        description: Translation content repository
        required: true
        default: ThreeMonth03/dsw-ui-locales-zh_Hant
        type: string
  push:
    branches:
      - main
    paths:
      - frontend/**
      - src/dsw_locale_tool/frontend.py
      - .github/workflows/publish-client.yml
      - .github/workflows/plan-maintained-releases.yml
  schedule:
    - cron: "29 5 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: localizable-dsw-client-publisher
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/plan-maintained-releases.yml
    with:
      translation_repository: ${{ inputs.translation_repository || 'ThreeMonth03/dsw-ui-locales-zh_Hant' }}

  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out tool
        uses: actions/checkout@v6
        with:
          path: tool

      - name: Check out exact DSW frontend release
        uses: actions/checkout@v6
        with:
          repository: ds-wizard/engine-frontend
          ref: v${{ matrix.recommended_app_version }}
          path: frontend-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Install tool
        run: python -m pip install ./tool

      - name: Apply strict localization transforms
        id: transform
        env:
          APP_VERSION: ${{ matrix.recommended_app_version }}
        run: |
          dsw-locale localize-frontend \
            --manifest tool/frontend/transforms.yml \
            --version "$APP_VERSION" \
            --source-root frontend-source \
            --report reports/frontend.json
          {
            echo "custom=$(jq --raw-output .custom reports/frontend.json)"
            echo "image=$(jq --raw-output .image reports/frontend.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.transform.outputs.custom == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable image
        if: steps.transform.outputs.custom == 'true'
        id: image
        env:
          IMAGE_REFERENCE: ${{ steps.transform.outputs.image }}
        run: |
          set +e
          inspection=$(docker buildx imagetools inspect "$IMAGE_REFERENCE" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Existing immutable image: $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$inspection" != *": not found"* && "$inspection" != *"manifest unknown"* ]]; then
            echo "Unable to inspect $IMAGE_REFERENCE:" >&2
            echo "$inspection" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Report official client release
        if: steps.transform.outputs.custom == 'false'
        env:
          IMAGE_REFERENCE: ${{ steps.transform.outputs.image }}
        run: echo "No frontend transform applies; use $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: steps.image.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-source/package-lock.json

      - name: Build and test DSW frontend
        if: steps.image.outputs.publish == 'true'
        working-directory: frontend-source
        run: |
          npm run replace-kernel-packages
          npm ci
          npm run test:wizard
          npm run build:wizard

      - name: Set up QEMU
        if: steps.image.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.image.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Publish localizable client
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: frontend-source
          file: frontend-source/app-wizard/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.transform.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.recommended_app_version }}

      - name: Smoke test published client
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.transform.outputs.image }}
        run: |
          docker run --detach --rm \
            --name dsw-localizable-client-smoke \
            --publish 127.0.0.1:18080:8080 \
            "$IMAGE_REFERENCE"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/wizard/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs dsw-localizable-client-smoke
          exit 1

      - name: Stop client smoke test
        if: always() && steps.image.outputs.publish == 'true'
        run: docker rm --force dsw-localizable-client-smoke 2>/dev/null || true

      - name: Summarize client image
        if: steps.transform.outputs.custom == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.transform.outputs.image }}
        run: |
          echo "Localizable client: $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload transform report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-localization-${{ matrix.recommended_app_version }}
          if-no-files-found: warn
          path: reports/frontend.json
