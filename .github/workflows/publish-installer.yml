name: Publish locale installer image

on:
  workflow_dispatch:
    inputs:
      translation_repository:
        description: Translation content repository
        required: true
        default: ThreeMonth03/dsw-ui-locales-zh_Hant
      translation_ref:
        description: Version branch, tag, or commit
        required: true
        default: sync/v4.32
      config_version:
        description: Key in translation-config.yml
        required: true
        default: v4.32

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tool
        uses: actions/checkout@v6
        with:
          path: tool

      - name: Check out translation content
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: ${{ inputs.translation_ref }}
          path: locale

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Build verified locale package
        run: |
          python -m pip install ./tool
          dsw-locale validate-config locale/translation-config.yml
          dsw-locale audit \
            --root locale \
            --report-dir reports \
            --fail-on placeholders \
            --fail-on structure
          dsw-locale build-source \
            --config locale/translation-config.yml \
            --version "${{ inputs.config_version }}" \
            --root locale \
            --output tool/build/locale
          dsw-locale package \
            --source tool/build/locale \
            --output tool/dist/locale.zip

      - name: Compute immutable image coordinates
        id: image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          tag=$(python -c 'import json; print(json.load(open("tool/build/locale/locale.json"))["version"])')
          name="ghcr.io/$owner/dsw-locale-installer"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=$name:$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an immutable tag
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set +e
          inspection=$(docker buildx imagetools inspect "$IMAGE_REFERENCE" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Refusing to overwrite existing image: $IMAGE_REFERENCE" >&2
            exit 1
          fi
          if [[ "$inspection" != *": not found"* && "$inspection" != *"manifest unknown"* ]]; then
            echo "Unable to determine whether $IMAGE_REFERENCE exists:" >&2
            echo "$inspection" >&2
            exit 1
          fi

      - name: Build and publish installer
        uses: docker/build-push-action@v6
        with:
          context: tool
          file: tool/docker/installer/Dockerfile
          push: true
          build-args: LOCALE_BUNDLE=dist/locale.zip
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Upload package and audit
        uses: actions/upload-artifact@v4
        with:
          name: dsw-locale-installer-${{ steps.image.outputs.tag }}
          path: |
            tool/dist/locale.zip
            reports/audit.json
            reports/audit.md
