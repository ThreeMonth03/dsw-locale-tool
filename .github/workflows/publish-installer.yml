name: Publish maintained locale installers

on:
  workflow_dispatch:
    inputs:
      translation_repository:
        description: Translation content repository
        required: true
        default: ThreeMonth03/dsw-ui-locales-zh_Hant
        type: string
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: maintained-locale-publisher
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/plan-maintained-releases.yml
    with:
      translation_repository: ${{ inputs.translation_repository || 'ThreeMonth03/dsw-ui-locales-zh_Hant' }}

  publish:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/publish-installer-release.yml
    with:
      translation_repository: ${{ needs.plan.outputs.translation_repository }}
      translation_ref: ${{ matrix.translation_ref }}
      config_version: ${{ matrix.config_version }}
    permissions:
      contents: read
      packages: write
