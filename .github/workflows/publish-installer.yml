name: Publish locale installer image

on:
  workflow_dispatch:
    inputs:
      translation_repository:
        description: Translation content repository
        required: true
        default: ThreeMonth03/dsw-ui-locales-zh_Hant
      translation_ref:
        description: Version branch, tag, or commit
        required: true
        default: sync/v4.32
      config_version:
        description: Key in translation-config.yml
        required: true
        default: v4.32
      image_tag:
        description: Immutable installer image tag
        required: true
        default: 4.32.0

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tool
        uses: actions/checkout@v6
        with:
          path: tool

      - name: Check out translation content
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: ${{ inputs.translation_ref }}
          path: locale

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Build verified locale package
        run: |
          python -m pip install ./tool
          dsw-locale validate-config locale/translation-config.yml
          dsw-locale sync-upstream \
            --config locale/translation-config.yml \
            --version "${{ inputs.config_version }}" \
            --output locale
          dsw-locale audit \
            --root locale \
            --report-dir reports \
            --fail-on placeholders \
            --fail-on structure
          dsw-locale build-source \
            --config locale/translation-config.yml \
            --version "${{ inputs.config_version }}" \
            --root locale \
            --output tool/build/locale
          dsw-locale package \
            --source tool/build/locale \
            --output tool/dist/locale.zip

      - name: Compute image name
        id: image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/dsw-locale-installer" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish installer
        uses: docker/build-push-action@v6
        with:
          context: tool
          file: tool/docker/installer/Dockerfile
          push: true
          build-args: LOCALE_BUNDLE=dist/locale.zip
          tags: ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.image_tag }}

      - name: Upload package and audit
        uses: actions/upload-artifact@v4
        with:
          name: dsw-locale-installer-${{ inputs.image_tag }}
          path: |
            tool/dist/locale.zip
            reports/audit.json
            reports/audit.md
