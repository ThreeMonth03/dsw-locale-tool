name: Publish one locale installer

on:
  workflow_call:
    inputs:
      translation_repository:
        required: true
        type: string
      translation_ref:
        required: true
        type: string
      config_version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tool
        uses: actions/checkout@v6
        with:
          path: tool

      - name: Check out translation content
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.translation_repository }}
          ref: ${{ inputs.translation_ref }}
          path: locale

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Install tool
        run: python -m pip install ./tool

      - name: Resolve immutable image coordinates
        id: image
        env:
          CONFIG_VERSION: ${{ inputs.config_version }}
        run: |
          dsw-locale release-info \
            --config locale/translation-config.yml \
            --version "$CONFIG_VERSION" > release.json
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          tag=$(jq --raw-output .locale_version release.json)
          dsw_version=$(jq --raw-output .recommended_app_version release.json)
          name="ghcr.io/$owner/dsw-locale-installer"
          revision=$(git -C locale rev-parse HEAD)
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "reference=$name:$tag"
            echo "revision=$revision"
            echo "dsw_version=$dsw_version"
          } >> "$GITHUB_OUTPUT"
          {
            echo "DSW_VERSION=$dsw_version"
            echo "DSW_CLIENT_IMAGE=datastewardshipwizard/wizard-client:$dsw_version"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable tag
        id: tag
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set +e
          inspection=$(docker buildx imagetools inspect "$IMAGE_REFERENCE" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Existing immutable image: $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$inspection" != *": not found"* && "$inspection" != *"manifest unknown"* ]]; then
            echo "Unable to inspect $IMAGE_REFERENCE:" >&2
            echo "$inspection" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.tag.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Build verified locale package
        if: steps.tag.outputs.publish == 'true'
        run: |
          dsw-locale validate-config locale/translation-config.yml
          dsw-locale audit \
            --root locale \
            --report-dir reports \
            --fail-on placeholders \
            --fail-on structure
          dsw-locale build-source \
            --config locale/translation-config.yml \
            --version "${{ inputs.config_version }}" \
            --root locale \
            --output tool/build/locale
          dsw-locale package \
            --source tool/build/locale \
            --output tool/dist/locale.zip

      - name: Build installer
        if: steps.tag.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: tool
          file: tool/docker/installer/Dockerfile
          load: true
          build-args: LOCALE_BUNDLE=dist/locale.zip
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ inputs.translation_repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}

      - name: Start disposable DSW for installer smoke test
        if: steps.tag.outputs.publish == 'true'
        run: |
          dsw-locale preview-config \
            --output tool/preview/runtime/application.yml \
            --client-url http://localhost:8080/wizard
          docker compose \
            --project-name dsw-locale-installer-smoke \
            --file tool/preview/docker-compose.yml \
            up --detach

      - name: Smoke test installer image
        if: steps.tag.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          run_installer() {
            docker run --rm \
              --network dsw-locale-installer-smoke_default \
              --read-only \
              --tmpfs /tmp:size=16m,mode=1777 \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --env DSW_API_URL=http://server:3000/wizard-api \
              --env DSW_ADMIN_EMAIL=albert.einstein@example.com \
              --env DSW_ADMIN_PASSWORD=password \
              "$IMAGE_REFERENCE"
          }

          first=$(run_installer)
          echo "$first"
          jq --exit-status \
            '.created == true and .enabled == true and .defaultLocale == true' \
            <<< "$first"

          second=$(run_installer)
          echo "$second"
          jq --exit-status \
            '.created == false and .enabled == true and .defaultLocale == true' \
            <<< "$second"

          docker compose \
            --project-name dsw-locale-installer-smoke \
            --file tool/preview/docker-compose.yml \
            restart server

          after_restart=$(run_installer)
          echo "$after_restart"
          jq --exit-status \
            '.created == false and .enabled == true and .defaultLocale == true' \
            <<< "$after_restart"

      - name: Collect installer smoke logs
        if: always() && steps.tag.outputs.publish == 'true'
        run: |
          mkdir -p reports/installer-smoke
          docker compose \
            --project-name dsw-locale-installer-smoke \
            --file tool/preview/docker-compose.yml \
            logs --no-color > reports/installer-smoke/docker-compose.log 2>&1 || true

      - name: Stop disposable DSW
        if: always() && steps.tag.outputs.publish == 'true'
        run: |
          docker compose \
            --project-name dsw-locale-installer-smoke \
            --file tool/preview/docker-compose.yml \
            down --volumes --remove-orphans

      - name: Publish installer
        if: steps.tag.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: docker push "$IMAGE_REFERENCE"

      - name: Upload new package and audit
        if: always() && steps.tag.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dsw-locale-installer-${{ steps.image.outputs.tag }}
          path: |
            tool/dist/locale.zip
            reports/audit.json
            reports/audit.md
            reports/installer-smoke/
