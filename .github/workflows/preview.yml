name: Render DSW locale preview

on:
  workflow_dispatch:
    inputs:
      translation_repository:
        description: Translation content repository
        required: true
        default: ThreeMonth03/dsw-ui-locales-zh_Hant
        type: string
      translation_ref:
        description: Version branch, tag, or commit
        required: true
        default: sync/v4.32
        type: string
      translation_control_ref:
        description: Branch containing shared version and preview configuration
        required: true
        default: main
        type: string
      config_version:
        description: Key in translation-config.yml
        required: true
        default: v4.32
        type: string
      dsw_image_tag:
        description: Official wizard-server and wizard-client image tag
        required: true
        default: "4.32"
        type: string
      file_knowledge_model_url:
        description: Optional KM JSON URL used to exercise project file screens
        required: false
        default: https://raw.githubusercontent.com/ds-wizard/dsw-e2e-tests/abdcfaef0851f6230e1b4c2eaeb96848c0a4c5a6/cypress/fixtures/file-km.json
        type: string

permissions:
  contents: read

concurrency:
  group: locale-preview-${{ inputs.translation_repository }}-${{ inputs.translation_ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: ./.github/workflows/preview-locale.yml
    with:
      translation_repository: ${{ inputs.translation_repository }}
      translation_ref: ${{ inputs.translation_ref }}
      translation_control_ref: ${{ inputs.translation_control_ref }}
      config_version: ${{ inputs.config_version }}
      dsw_image_tag: ${{ inputs.dsw_image_tag }}
      file_knowledge_model_url: ${{ inputs.file_knowledge_model_url }}
