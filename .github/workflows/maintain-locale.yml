name: Maintain locale release lines

on:
  workflow_call:

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - name: Check out trusted locale tool
        uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: main
          path: tool
          persist-credentials: false

      - name: Check out translation control branch
        uses: actions/checkout@v6
        with:
          path: locale
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Install trusted locale tool
        run: python -m pip install ./tool

      - name: Reconcile Weblate release lines
        run: |
          dsw-locale reconcile-versions \
            --config locale/translation-config.yml \
            --report-dir reports/maintenance

      - name: Resolve maintained versions
        id: plan
        run: echo "versions=$(jq -c '.managed_versions' reports/maintenance/maintenance.json)" >> "$GITHUB_OUTPUT"

      - name: Commit control-plane changes
        working-directory: locale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation-config.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reconcile DSW release lines"
          git push origin HEAD:main

      - name: Add plan to job summary
        run: cat reports/maintenance/maintenance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload maintenance plan
        uses: actions/upload-artifact@v7
        with:
          name: locale-maintenance-plan
          path: reports/maintenance/

  synchronize:
    needs: reconcile
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.reconcile.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted locale tool
        uses: actions/checkout@v6
        with:
          repository: ThreeMonth03/dsw-locale-tool
          ref: main
          path: tool
          persist-credentials: false

      - name: Check out translation repository
        uses: actions/checkout@v6
        with:
          path: locale
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install trusted locale tool
        run: python -m pip install ./tool

      - name: Select version branch
        id: branch
        working-directory: locale
        env:
          VERSION: ${{ matrix.version }}
        run: |
          branch="sync/$VERSION"
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --create "$branch" --track "origin/$branch"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git switch --create "$branch"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Synchronize official baseline
        id: upstream
        continue-on-error: true
        run: |
          dsw-locale sync-upstream \
            --config locale/translation-config.yml \
            --version "${{ matrix.version }}" \
            --output locale

      - name: Refresh translation forms
        id: forms
        if: steps.upstream.outcome == 'success'
        continue-on-error: true
        run: dsw-locale refresh-tree --root locale

      - name: Audit synchronized locale
        id: audit
        if: steps.forms.outcome == 'success'
        continue-on-error: true
        run: |
          dsw-locale audit \
            --root locale \
            --report-dir locale/reports \
            --fail-on placeholders \
            --fail-on structure

      - name: Build synchronized locale
        id: build
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        run: |
          dsw-locale build-source \
            --config locale/translation-config.yml \
            --version "${{ matrix.version }}" \
            --root locale \
            --output "build/${{ matrix.version }}/locale"

      - name: Package synchronized locale
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          dsw-locale package \
            --source "build/${{ matrix.version }}/locale" \
            --output "dist/dsw_zh_Hant_${{ matrix.version }}.zip"

      - name: Commit safe synchronization
        if: >-
          steps.upstream.outcome == 'success' &&
          steps.forms.outcome == 'success' &&
          ((steps.audit.outcome == 'success' && steps.package.outcome == 'success') ||
          steps.branch.outputs.created == 'true')
        working-directory: locale
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          VERSION: ${{ matrix.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream translations
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m "Sync official locale baseline for $VERSION"
            changed=true
          fi
          if [ "${{ steps.branch.outputs.created }}" = "true" ]; then
            git push --set-upstream origin "$BRANCH"
          elif [ "$changed" = "true" ]; then
            git push origin "$BRANCH"
          fi

      - name: Report maintenance failure
        if: >-
          always() &&
          (steps.upstream.outcome == 'failure' ||
          steps.forms.outcome == 'failure' ||
          steps.audit.outcome == 'failure' ||
          steps.build.outcome == 'failure' ||
          steps.package.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
          UPSTREAM_OUTCOME: ${{ steps.upstream.outcome }}
          FORMS_OUTCOME: ${{ steps.forms.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[locale maintenance] $VERSION requires attention"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          body="Automated locale maintenance failed for $VERSION. upstream=$UPSTREAM_OUTCOME, forms=$FORMS_OUTCOME, audit=$AUDIT_OUTCOME, build=$BUILD_OUTCOME, package=$PACKAGE_OUTCOME. Run: $RUN_URL"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label automation --body "$body"
          fi

      - name: Upload synchronized package and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locale-maintenance-${{ matrix.version }}
          if-no-files-found: warn
          path: |
            locale/reports/
            dist/*.zip

      - name: Fail unsafe synchronization
        if: >-
          always() &&
          (steps.upstream.outcome == 'failure' ||
          steps.forms.outcome == 'failure' ||
          steps.audit.outcome == 'failure' ||
          steps.build.outcome == 'failure' ||
          steps.package.outcome == 'failure')
        run: exit 1
