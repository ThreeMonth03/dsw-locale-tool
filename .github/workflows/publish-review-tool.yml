name: Publish review sandbox tool

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/review/**
      - src/dsw_locale_tool/**
      - pyproject.toml
      - README.md
      - LICENSE
      - .github/workflows/publish-review-tool.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: review-sandbox-tool-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tool
        uses: actions/checkout@v6

      - name: Resolve image coordinates
        id: image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          immutable="ghcr.io/$owner/dsw-review-tool:git-${GITHUB_SHA::12}"
          current="ghcr.io/$owner/dsw-review-tool:main"
          {
            echo "immutable=$immutable"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish review tool
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/review/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.immutable }}
            ${{ steps.image.outputs.current }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test published image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.immutable }}
        run: |
          docker run --rm "$IMAGE_REFERENCE" --help
          docker run --rm --entrypoint python "$IMAGE_REFERENCE" -c \
            "from importlib.resources import files; assert files('dsw_locale_tool').joinpath('review_site/index.html').is_file()"

      - name: Summarize image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.immutable }}
        run: |
          echo "Review tool: $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
